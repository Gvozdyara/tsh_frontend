<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>TSH knowledge base</title>
  <meta name="description" content="TSH knowledge base: articles, inner layer and search." />

  <!-- installable web app (PWA): icons from /icons, manifest + sw.js are
       served by the same nginx that serves this page -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0d1520" />
  <meta name="application-name" content="TSH" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="TSH" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="root">
    <noscript>This application needs JavaScript. / Для работы приложения нужен JavaScript.</noscript>
  </div>

  <!-- injected by the container entrypoint; provides window.__TSH_ENV__ -->
  <script src="/config.js"></script>
  <!-- vendored, pinned libraries: React 18 UMD + htm tagged templates -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/htm.umd.js"></script>
  <!-- application code -->
  <script src="/api.js"></script>
  <script src="/app.js"></script>
</body>
</html>
